<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <meta name="description" content="用四行信号看懂 S7-1200 的输入滤波、扫描采样和脉冲捕捉。">
  <title>PLCS7-1200 数字输入采样机制</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=13">
  <script src="./app.js?v=13" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro"><h1>PLCS7-1200 数字输入采样机制</h1></header>
    <section class="experiment" aria-label="四行信号仿真">
      <div class="chart-head"><span>同一个波，四行对照</span><span class="legend"><i></i> 虚线是 CPU 读取时刻</span></div>
      <div class="signal-row first-row">
        <div class="row-label"><span class="step">01</span><h2>现场输入</h2></div>
        <div class="row-main">
          <div class="wave" id="wave-raw" role="img" aria-label="现场输入波形"></div>
          <div class="row-control source-controls">
            <label for="pulse-width">脉冲宽度 <span class="number-field"><input id="pulse-width" type="number" min="0.1" max="40" step="any" value="8" inputmode="decimal">ms</span></label>
            <label for="pulse-start">到来时刻 <span class="number-field"><input id="pulse-start" type="number" min="0" max="40" step="any" value="5" inputmode="decimal">ms</span></label>
          </div>
        </div>
        <button class="emit" id="emit" type="button">发出一个波 <span aria-hidden="true">→</span></button>
      </div>
      <div class="signal-row filter-row">
        <div class="row-label"><span class="step">02</span><h2>滤波后</h2></div>
        <div class="row-main">
          <div class="wave filter-wave" id="wave-filtered" role="img" aria-label="上方梯形表示滤波累计值，下方阶梯线表示认可状态"></div>
          <div class="row-control filter-controls">
            <label for="filter-time">滤波时间 <span class="number-field"><input id="filter-time" type="number" min="0" max="20" step="any" value="6.4" inputmode="decimal">ms</span></label>
            <span class="filter-key"><i class="key-charge"></i>累计值 <strong id="meter-text">0 / 6.4 ms</strong><i class="key-accepted"></i>认可状态</span>
          </div>
          <p class="mechanism">输入为 1 时累计上升，到设定时间才认 1；输入为 0 时累计回退，归零才认 0。</p>
        </div>
      </div>
      <div class="signal-row">
        <div class="row-label"><span class="step">03</span><h2>普通采样 I</h2></div>
        <div class="row-main">
          <div class="wave" id="wave-normal" role="img" aria-label="普通采样得到的输入 I 波形"></div>
          <div class="row-control"><label for="scan-time">扫描周期 <span class="number-field"><input id="scan-time" type="number" min="1" max="40" step="any" value="10" inputmode="decimal">ms</span></label></div>
          <p class="row-note">I 保持到下一次读取。</p>
        </div>
      </div>
      <div class="signal-row">
        <div class="row-label"><span class="step">04</span><h2>脉冲捕捉 I</h2></div>
        <div class="row-main"><div class="wave" id="wave-caught" role="img" aria-label="启用脉冲捕捉后得到的输入 I 波形"></div><p class="row-note">锁住通过滤波的脉冲，交给下一次读取。</p></div>
      </div>
      <div class="time-axis" id="time-axis" aria-hidden="true"></div>
    </section>
    <section class="result" aria-live="polite" aria-atomic="true" hidden>
      <div class="counts"><span>穿过滤波 <b id="filtered-count">—</b></span><span>普通采样 <b id="normal-count">—</b></span><span>脉冲捕捉 <b id="caught-count">—</b></span></div>
      <p id="explanation"></p>
    </section>
    <footer>累计曲线按手册规则模拟，并非可直接读取的内部数值。滤波时间 0 仅用于本页演示；实机需选设备支持的档位。本页假定扫描周期固定。<a href="https://docs.tia.siemens.cloud/r/simatic_s7_1200_manual_collection_enus_20/device-configuration/configuring-the-operation-of-the-cpu/configuring-digital-input-filter-times" target="_blank" rel="noopener noreferrer">西门子手册 ↗</a></footer>
  </main>
</body>
</html>
